[package]
name = "renderprobe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "gles"] }
naga = { version = "=30.0.1", features = ["wgsl-in", "glsl-out"] }
binary-greedy-meshing = "=0.5.2"
glam = { version = "0.34.0", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
png = "0.18.1"
env_logger = "0.11"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
