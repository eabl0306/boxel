# Template copied over vendor/crates/boxel_tasks/Cargo.toml by tools/refork/refork.sh. Edit HERE, not in vendor/.
[package]
name = "boxel_tasks"
version = "0.1.0"
edition = "2024"
description = "Task pools for boxel (fork of bevy_tasks)"
license = "MIT OR Apache-2.0"

[features]
default = ["async_executor", "multi_threaded"]
multi_threaded = ["dep:async-channel", "dep:concurrent-queue", "async_executor"]
async_executor = ["dep:async-executor"]

[dependencies]
boxel_utils = { path = "../boxel_utils", version = "0.1.0", default-features = false }
futures-lite = { version = "2.0.1", default-features = false, features = ["std"] }
async-task = { version = "4.4.0", default-features = false }
derive_more = { version = "2", default-features = false, features = ["deref", "deref_mut"] }
async-executor = { version = "1.11", optional = true }
async-channel = { version = "2.3.0", optional = true }
concurrent-queue = { version = "2.0.0", optional = true }
atomic-waker = { version = "1", default-features = false }
crossbeam-queue = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
async-channel = "2.3.0"

[lints]
workspace = true
