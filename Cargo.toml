[package]
name = "boxel"
description = "A Bevy-style voxel engine with runtime GPU tier detection on top of wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["voxel", "game-engine", "gamedev", "wgpu", "ecs"]
categories = ["game-engines", "graphics", "rendering"]
exclude = [".github/", "tools/", "docs/", "vendor/"]

[workspace]
resolver = "3"
members = ["crates/*"]
# The vendored ECS fork is its own Cargo workspace (vendor/Cargo.toml): Bevy's lint set,
# its own lockfile for `cargo test`/Miri inside vendor/, zero edits to library code.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
# MSRV = stable - 2 (1.99 is current upstream stable). Must stay >= wgpu 30 (1.87) and the ECS fork (1.95).
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eabl0306/boxel"

[workspace.dependencies]
# ---- boxel crates (path + version so they stay publishable)
boxel_app = { path = "crates/boxel_app", version = "0.1.0-dev" }
boxel_log = { path = "crates/boxel_log", version = "0.1.0-dev" }
boxel_diagnostic = { path = "crates/boxel_diagnostic", version = "0.1.0-dev" }
boxel_math = { path = "crates/boxel_math", version = "0.1.0-dev" }
boxel_transform = { path = "crates/boxel_transform", version = "0.1.0-dev" }
boxel_window = { path = "crates/boxel_window", version = "0.1.0-dev" }
boxel_camera = { path = "crates/boxel_camera", version = "0.1.0-dev" }
boxel_gfx = { path = "crates/boxel_gfx", version = "0.1.0-dev", default-features = false }
boxel_shaders = { path = "crates/boxel_shaders", version = "0.1.0-dev" }
boxel_render = { path = "crates/boxel_render", version = "0.1.0-dev" }
boxel_voxel = { path = "crates/boxel_voxel", version = "0.1.0-dev" }
boxel_mesh = { path = "crates/boxel_mesh", version = "0.1.0-dev" }
boxel_light = { path = "crates/boxel_light", version = "0.1.0-dev" }
boxel_worldgen = { path = "crates/boxel_worldgen", version = "0.1.0-dev" }
boxel_world = { path = "crates/boxel_world", version = "0.1.0-dev" }
boxel_debug = { path = "crates/boxel_debug", version = "0.1.0-dev" }
boxel_physics = { path = "crates/boxel_physics", version = "0.1.0-dev" }
boxel_pack = { path = "crates/boxel_pack", version = "0.1.0-dev" }
boxel_fog = { path = "crates/boxel_fog", version = "0.1.0-dev" }
boxel_ui = { path = "crates/boxel_ui", version = "0.1.0-dev" }
# Example content (#48): not published, so path only. Engine crates take it as a dev-dependency
# (cargo strips those on publish); the demo depends on no engine crate but voxel, worldgen, pack
# and fog (plain layer data).
boxel_demo = { path = "crates/boxel_demo" }
# ---- vendored ECS fork (generated by tools/refork; see vendor/UPSTREAM.md)
boxel_ecs = { path = "vendor/crates/boxel_ecs", version = "0.1.0", default-features = false, features = ["std", "async_executor", "multi_threaded", "backtrace"] }
boxel_tasks = { path = "vendor/crates/boxel_tasks", version = "0.1.0", default-features = false, features = ["async_executor", "multi_threaded"] }

# ---- GPU / platform: exact pins, upgraded deliberately (ADR 0001)
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "gles", "dx12", "metal"] }
naga = { version = "=30.0.1", default-features = false }
winit = "=0.30.13"
pollster = "1.0.1"

# ---- engine libraries
glam = { version = "=0.34.0", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
binary-greedy-meshing = "=0.5.2"
offset-allocator = "0.2.0"
slotmap = "1.1.1"
foldhash = "0.2.0"
crossbeam-channel = "0.5.17"
bitflags = "2.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
toml = "1.1.6"
thiserror = "2.0.21"
variadics_please = "2.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-tracy = "=0.12.0"
profiling = { version = "1.0.18", default-features = false }
log = "0.4.34"
png = "0.18.1"
# World saves (ADR 0024): an embedded key-value store in pure Rust and LZ4 block compression
# (no frame format: no twox-hash).
redb = "4.3.0"
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }

# ---- dev-only
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"            # opt out locally with #[expect(unsafe_code, reason = "...")]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
# rust_2018_idioms is deliberately off: `elided_lifetimes_in_paths` fires on every Bevy-style system param.

[workspace.lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
allow_attributes_without_reason = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
large_stack_arrays = "warn"
large_stack_frames = "warn"
trivially_copy_pass_by_ref = "warn"
type_complexity = "allow"
too_many_arguments = "allow"
module_name_repetitions = "allow"

[lints]
workspace = true

[features]
default = ["window", "render", "voxel", "png", "debug", "physics"]
window = ["dep:boxel_window", "dep:boxel_camera"]
voxel = ["dep:boxel_voxel", "dep:boxel_mesh", "dep:boxel_worldgen", "dep:boxel_world"]
# Own minimal physics (boxel_physics, ADR 0016): voxel sweep and raycast today. The crate is on
# by default; its PhysicsPlugin is not in DefaultPlugins (games add it).
physics = ["voxel", "dep:boxel_physics"]
render = [
    "window",
    "voxel",
    "dep:boxel_fog",
    "dep:boxel_gfx",
    "dep:boxel_shaders",
    "dep:boxel_render",
    "dep:boxel_debug",
]
# PNG screenshots (RequestScreenshot) and RgbaImage::{save_png, load_png}.
png = ["boxel_gfx?/png", "boxel_render?/png"]
# System/component names in ECS diagnostics (B0001 conflicts, schedule errors) and trace spans.
# Without it they print "<Enable the debug feature to see the name>". Disable for shipping builds.
debug = ["boxel_ecs/debug"]
# Spawn/insert caller locations in ECS diagnostics.
track_location = ["boxel_ecs/track_location"]
# A tracing span per system run, plus spans inside the world and render systems (interest,
# jobs, uploads, submit). For profiling only: every span costs time, even without a reader.
trace = [
    "debug",
    "boxel_ecs/trace",
    "boxel_world?/trace",
    "boxel_render?/trace",
    "boxel_physics?/trace",
]
trace_tracy = ["trace", "boxel_log/tracy"]
# Vulkan escape hatch (Windows/Linux only; a no-op elsewhere).
hal = ["boxel_gfx?/hal"]
# Minecraft Java resource-pack reader (textures, models, blockstates). The renderer reads packs
# through boxel_render::TextureSource either way; this re-exports the reader as boxel::pack.
pack = ["dep:boxel_pack"]

[dependencies]
boxel_ecs.workspace = true
boxel_tasks.workspace = true
boxel_app.workspace = true
boxel_log.workspace = true
boxel_diagnostic.workspace = true
boxel_math.workspace = true
boxel_transform.workspace = true
boxel_window = { workspace = true, optional = true }
boxel_camera = { workspace = true, optional = true }
boxel_gfx = { workspace = true, optional = true }
boxel_shaders = { workspace = true, optional = true }
boxel_render = { workspace = true, optional = true }
boxel_voxel = { workspace = true, optional = true }
boxel_mesh = { workspace = true, optional = true }
boxel_worldgen = { workspace = true, optional = true }
boxel_world = { workspace = true, optional = true }
boxel_debug = { workspace = true, optional = true }
boxel_physics = { workspace = true, optional = true }
boxel_pack = { workspace = true, optional = true }
boxel_fog = { workspace = true, optional = true }

[dev-dependencies]
# The example content (#48), for tests, benches and examples only.
boxel_demo.workspace = true
tracing.workspace = true

[[example]]
name = "headless_world"
required-features = ["voxel"]
# Runs its option and jump-check tests with `cargo test`.
test = true

[[example]]
name = "voxel_world"
# Block picking uses boxel::physics.
required-features = ["render", "voxel", "png", "physics"]
# Runs its option-parsing tests with `cargo test`.
test = true

[[example]]
name = "physics_sandbox"
required-features = ["render", "voxel", "physics"]
# Runs its option, drop-test and item tests (headless) with `cargo test`.
test = true

# `cargo test` also runs the unit tests inside the example (options, camera script, report,
# the physics bodies of `--bodies`).
[[example]]
name = "stress"
required-features = ["render", "voxel", "physics"]
test = true

# Headless screenshots: the world streamed around a camera, rendered offscreen to PNGs.
[[example]]
name = "snapshot"
required-features = ["render", "voxel", "png"]
# Runs its option tests with `cargo test`.
test = true

# Profiles only apply to this workspace's own examples/tests/benches.
[profile.dev]
opt-level = 1
# Line tables only (file and line in backtraces, no variable info): full debug info made each test
# binary 300+ MB, and linking several at once pushed a test build past 13 GB on a 22 GB laptop.
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 3
[profile.release]
lto = "thin"
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
