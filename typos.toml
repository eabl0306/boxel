[files]
# vendor/ is upstream Bevy code (never "fix" it here); docs/ and README.md are in Spanish.
# assets/ and game/ are local only (git-ignored); target-*/ are agent build dirs.
extend-exclude = ["target/", "target-*/", "vendor/", "docs/", "README.md", "AGENTS.md", "*.png", "*.lock", "assets/", "game/"]

[default]
locale = "en-us"

[default.extend-words]
# level of detail
lod = "lod"

[default.extend-identifiers]
