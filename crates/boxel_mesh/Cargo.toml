[package]
name = "boxel_mesh"
description = "Binary greedy meshing of 32^3 voxel chunks into 8-byte PackedQuads for boxel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
boxel_voxel.workspace = true
# `PaddedLight`, the light the mesher bakes into the quads.
boxel_light.workspace = true
bytemuck.workspace = true
foldhash.workspace = true

[dev-dependencies]
# The example content (#48), for tests, benches and examples only.
boxel_demo.workspace = true
# The merge is an in-repo fork (src/greedy.rs); the original is the reference of the
# byte-for-byte regression test.
binary-greedy-meshing.workspace = true
proptest.workspace = true
criterion.workspace = true
# The `gather_mesh/cave` and `gather_mesh/surface` benches mesh chunks of the overworld
# generator (the surface one lit by `boxel_light`).
boxel_worldgen.workspace = true

# Criterion flags (--quick, --save-baseline) must not reach the lib unit-test harness.
[lib]
bench = false

[[bench]]
name = "mesh"
harness = false

[lints]
workspace = true
