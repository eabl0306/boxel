[package]
name = "boxel_worldgen"
description = "World generation for boxel: the generator trait, a flat generator and exact integer noise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The exported harnesses of a realm's far LOD (`region::check_lod` and `region::check_seam`, ADR
# 0039 sec. 10), for the tests of a game's or a mod's kinds. The seam harness meshes chunks and
# LOD nodes as the renderer draws them.
test-support = ["dep:boxel_mesh"]

[dependencies]
boxel_voxel.workspace = true
# The meshes of the seam harness (`test-support` only).
boxel_mesh = { workspace = true, optional = true }

[dev-dependencies]
# Enables `test-support` for the crate's own integration tests.
boxel_worldgen = { workspace = true, features = ["test-support"] }
# The example content (#48), for tests only.
boxel_demo.workspace = true
# The far LOD bench meshes the region pass's nodes as a LOD job does (ADR 0031).
boxel_mesh.workspace = true
# The `test:` blocks of engine tests (#48).
boxel_voxel = { workspace = true, features = ["testing"] }
# Property tests of the noise kit and the field bounds (#67).
proptest.workspace = true
# Grid against point benches of the noise kit and the fields (#67).
criterion.workspace = true

# Criterion flags (--quick, --save-baseline) from `cargo bench --workspace` must not reach the
# lib unit-test harness.
[lib]
bench = false

[[bench]]
name = "noise"
harness = false

[[bench]]
name = "region"
harness = false

[[bench]]
name = "region_lod"
harness = false

[lints]
workspace = true
