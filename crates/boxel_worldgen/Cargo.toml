[package]
name = "boxel_worldgen"
description = "World generation for boxel: the generator trait, a flat generator and exact integer noise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
boxel_voxel.workspace = true

[dev-dependencies]
# The example content (#48), for tests only.
boxel_demo.workspace = true
# The `test:` blocks of engine tests (#48).
boxel_voxel = { workspace = true, features = ["testing"] }

# Criterion flags (--quick, --save-baseline) from `cargo bench --workspace` must not reach the
# lib unit-test harness.
[lib]
bench = false

[lints]
workspace = true
