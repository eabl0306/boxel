[package]
name = "boxel_worldgen"
description = "World generation traits and generators (flat, terrain, forest, overworld with caves) for boxel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
boxel_voxel.workspace = true

[dev-dependencies]
