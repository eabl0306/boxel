[package]
name = "boxel_voxel"
description = "Voxel data model for boxel: coordinates, block registry, paletted 32^3 chunks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
glam.workspace = true
bitflags.workspace = true
foldhash.workspace = true
thiserror.workspace = true

[features]
# boxel_voxel::testing, a minimal `test:` block set for the tests of other engine crates (#48).
testing = []

[dev-dependencies]
# The example content (#48), for tests, benches and examples only.
boxel_demo.workspace = true
proptest.workspace = true
criterion.workspace = true

# Criterion flags (--quick, --save-baseline) must not reach the lib unit-test harness.
[lib]
bench = false

[[bench]]
name = "paletted"
harness = false

[lints]
workspace = true
