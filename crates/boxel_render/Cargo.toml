[package]
name = "boxel_render"
description = "boxel's voxel renderer: High/Mid/Low tier paths over one quad format, no render graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Tracing spans inside the systems (frame breakdowns; the facade's `trace`). Off: no code.
trace = []
# PNG screenshots (RequestScreenshot). Without it ScreenshotSaved carries an error.
png = ["boxel_gfx/png"]

[dependencies]
boxel_ecs.workspace = true
boxel_app.workspace = true
boxel_diagnostic.workspace = true
boxel_math.workspace = true
boxel_transform.workspace = true
boxel_window.workspace = true
boxel_camera.workspace = true
boxel_gfx.workspace = true
boxel_shaders.workspace = true
boxel_voxel.workspace = true
boxel_mesh.workspace = true
boxel_world.workspace = true
# Block textures from a Minecraft resource pack (TextureSource::Pack).
boxel_pack.workspace = true
# The fog layers, their noise and the reference march (ADR 0030).
boxel_fog.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
# Answers of the translucent sort jobs (Send + Sync, unlike std's receiver).
crossbeam-channel.workspace = true
foldhash.workspace = true
offset-allocator.workspace = true
pollster.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The example content (#48), for tests, benches and examples only.
boxel_demo.workspace = true
boxel_gfx = { workspace = true, features = ["png"] }
boxel_worldgen.workspace = true
# The `test:` blocks of boxel_voxel::testing (the LOD plugin's unit tests).
boxel_voxel = { workspace = true, features = ["testing"] }
# Lit scenes in tests/gpu_terrain.rs: light computed exactly as the world computes it.
boxel_light.workspace = true
# Tests get system/component names in ECS diagnostics (dev-only; users opt in through boxel/debug).
boxel_ecs = { workspace = true, features = ["debug"] }
pollster.workspace = true

[lints]
workspace = true
