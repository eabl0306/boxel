[package]
name = "boxel_world"
description = "Chunk map, streaming lifecycle, job scheduling and edits for boxel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Tracing spans inside the systems (frame breakdowns; the facade's `trace`). Off: no code.
trace = []

[dependencies]
boxel_ecs.workspace = true
boxel_tasks.workspace = true
boxel_app.workspace = true
boxel_diagnostic.workspace = true
boxel_math.workspace = true
boxel_transform.workspace = true
boxel_voxel.workspace = true
boxel_mesh.workspace = true
boxel_light.workspace = true
boxel_worldgen.workspace = true
slotmap.workspace = true
foldhash.workspace = true
crossbeam-channel.workspace = true
bitflags.workspace = true
tracing.workspace = true
redb.workspace = true
lz4_flex.workspace = true

[dev-dependencies]
# The example content (#48), for tests, benches and examples only.
boxel_demo.workspace = true
# The `test:` blocks of boxel_voxel::testing (the LOD's unit tests).
boxel_voxel = { workspace = true, features = ["testing"] }
# Tests get system/component names in ECS diagnostics (dev-only; users opt in through boxel/debug).
boxel_ecs = { workspace = true, features = ["debug"] }
proptest.workspace = true
criterion.workspace = true

# Criterion flags (--quick, --save-baseline) must not reach the lib unit-test harness.
[lib]
bench = false

[[bench]]
name = "interest"
harness = false

[[bench]]
name = "fluid"
harness = false

[[bench]]
name = "cave_culling"
harness = false

[[bench]]
name = "neighbor_rules"
harness = false

[lints]
workspace = true
